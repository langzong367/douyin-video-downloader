<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="粘贴抖音链接或分享文案，下载公开可访问的视频。">
  <title>一贴即下｜抖音视频下载</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#18181b;background:#fafafa}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}header{max-width:1040px;margin:auto;padding:28px 24px}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}.mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #e4e4e7;border-radius:8px;background:white;font-size:20px;color:#52525b}
    main{width:min(100% - 40px,640px);margin:clamp(48px,12vh,120px) auto 48px}.hero{margin:0;font-size:clamp(28px,5vw,36px);line-height:1.4;font-weight:600;text-wrap:balance}.lead{margin:12px 0 0;color:#71717a;font-size:15px;line-height:1.8;text-wrap:pretty}
    .panel{margin-top:32px;padding:24px;background:#fff;border:1px solid #e4e4e7;border-radius:16px}label{display:block;margin-bottom:12px;font-size:14px;font-weight:500}.form-row{display:flex;gap:10px}.input-wrap{flex:1;min-width:0}.input{width:100%;height:48px;padding:0 14px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;color:#18181b;font-size:16px}.input::placeholder{color:#71717a}.input:focus{outline:2px solid #a1a1aa;outline-offset:2px}.button,.download{min-height:48px;padding:0 20px;border:1px solid #18181b;border-radius:8px;background:#18181b;color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}.button:hover,.download:hover{background:#3f3f46}.button:focus-visible,.download:focus-visible{outline:2px solid #71717a;outline-offset:3px}.button:disabled,.download:disabled{opacity:.55;cursor:wait}
    .status{min-height:22px;margin-top:14px;color:#71717a;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.status.error{color:#b91c1c}.result{display:none;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid #e4e4e7}.result.show{display:flex}.result-copy{min-width:0}.title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.id{margin-top:6px;color:#71717a;font-size:12px;font-variant-numeric:tabular-nums}.download{flex:none;background:#f4f4f5;border-color:#e4e4e7;color:#18181b}.download:hover{background:#e4e4e7}.note{margin:20px 4px 0;color:#71717a;font-size:12px;line-height:1.8;text-wrap:pretty}
    @media(max-width:520px){header{padding:22px 20px}main{margin-top:48px}.panel{padding:20px}.form-row{flex-direction:column}.button{width:100%}.result{align-items:stretch;flex-direction:column}.download{width:100%}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true">↓</span>一贴即下</div></header>
  <main><section class="wrap">
    <h1 class="hero">粘贴链接，轻松保存视频</h1>
    <p class="lead">抖音链接或整段分享文案，粘贴即可。</p>
    <form class="panel" id="form">
      <label for="video-url">抖音链接或分享文案</label>
      <div class="form-row"><div class="input-wrap"><input class="input" id="video-url" maxlength="8000" required placeholder="粘贴链接，或直接粘贴抖音分享文案"></div><button class="button" id="submit" type="submit">解析视频</button></div>
      <div class="status" id="status" aria-live="polite">粘贴公开可访问的视频链接</div>
      <div class="result" id="result"><div class="result-copy"><div class="title" id="title"></div><div class="id" id="video-id"></div></div><button class="download" id="download" type="button">↓ 下载 MP4</button></div>
    </form>
    <p class="note">请仅下载你有权保存的内容。私密、已删除或受地区限制的视频无法解析。</p>
  </section></main>
  <script>
    const form=document.querySelector('#form'),input=document.querySelector('#video-url'),submit=document.querySelector('#submit'),status=document.querySelector('#status'),result=document.querySelector('#result'),title=document.querySelector('#title'),videoId=document.querySelector('#video-id'),download=document.querySelector('#download');let video;
    const setStatus=(message,error=false)=>{status.textContent=message;status.classList.toggle('error',error)};
    input.addEventListener('input',()=>{video=null;result.classList.remove('show');setStatus('粘贴公开可访问的视频链接')});
    form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;submit.textContent='解析中…';result.classList.remove('show');setStatus('正在读取视频信息…');try{const response=await fetch('/api/video?url='+encodeURIComponent(input.value),{signal:AbortSignal.timeout(65000)});const data=await response.json();if(!response.ok)throw new Error(data.error||'解析失败，请稍后重试');video=data;title.textContent=data.title;videoId.textContent='ID '+data.id;result.classList.add('show');setStatus('链接已识别，可以下载')}catch(error){setStatus(error.message||'网络连接失败，请重试',true)}finally{submit.disabled=false;submit.textContent='解析视频'}});
    download.addEventListener('click',async()=>{if(!video)return;download.disabled=true;download.textContent='正在下载…';setStatus('正在从抖音读取视频，请不要关闭页面…');try{const response=await fetch(video.downloadUrl,{signal:AbortSignal.timeout(30000)});const media=await response.json();if(!response.ok)throw new Error(media.error||'下载准备失败');const file=await fetch(media.url);if(!file.ok)throw new Error('视频文件读取失败');const objectUrl=URL.createObjectURL(await file.blob());const anchor=document.createElement('a');anchor.href=objectUrl;anchor.download=media.filename;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);setStatus('下载已开始')}catch(error){setStatus(error.message||'下载失败，请重试',true)}finally{download.disabled=false;download.textContent='↓ 下载 MP4'}});
  </script>
</body>
</html>
