[build]
  command = "npm run build && zip -qr netlify-static/feishu-extension.zip extension -x 'extension/*.test.mjs'"
  publish = "netlify-static"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
