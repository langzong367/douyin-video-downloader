<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一贴即下</title>
  <style>
    body{width:300px;margin:0;padding:20px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18181b;background:#fafafa}
    h1{font-size:17px;margin:0 0 10px}p{margin:0 0 16px;color:#52525b}
    button{width:100%;height:42px;border:0;border-radius:8px;background:#18181b;color:white;font:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible{outline:2px solid #71717a;outline-offset:2px}
    #status{min-height:22px;margin:10px 0 0;font-size:12px;color:#52525b}
  </style>
</head>
<body>
  <h1>一贴即下 · 飞书视频</h1>
  <p id="hint">在已登录的飞书文档中播放视频，再点击这里。</p>
  <button id="download" disabled>下载当前视频</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
